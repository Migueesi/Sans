<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SANS Burgers · POS</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#000;
  --carbon:#141414;
  --panel:#1d1d1d;
  --linea:#2e2e2e;
  --amarillo:#FFC81E;
  --amarillo-osc:#d9a600;
  --gris:#9a9a9a;
  --blanco:#f5f5f0;
  --ok:#5fd38a;
  --alerta:#ff6b5a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--negro);color:var(--blanco);
  padding-top:env(safe-area-inset-top,0px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}

/* Pantalla de bienvenida */
#splash{position:fixed;inset:0;background:var(--negro);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;z-index:50;transition:opacity .5s .6s,visibility 0s 1.1s}
#splash img{width:180px;height:180px;border-radius:50%}
#splash p{color:var(--amarillo);font-weight:700;letter-spacing:.02em}
body.listo #splash{opacity:0;visibility:hidden}

/* Estructura */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--carbon);
  border-bottom:3px solid var(--amarillo)}
header img{width:44px;height:44px;border-radius:50%}
header h1{font-size:1.25rem;font-weight:800;color:var(--amarillo);line-height:1}
header small{display:block;color:var(--gris);font-size:.72rem;font-weight:400;margin-top:3px}
#instalar{margin-left:auto;background:var(--amarillo);color:var(--negro);font-weight:700;
  padding:8px 14px;border-radius:999px;font-size:.85rem;display:none}
main{overflow-y:auto;padding:18px 16px 28px}
.vista{max-width:960px;margin:0 auto}
.vista h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.vista .sub{color:var(--gris);margin-bottom:18px}

/* Menú: abajo en celular, a la izquierda en pantallas grandes */
nav{display:flex;overflow-x:auto;background:var(--carbon);border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 76px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 6px;font-size:.72rem;color:var(--gris);border-top:3px solid transparent}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.activo{color:var(--amarillo);border-top-color:var(--amarillo)}

/* Panel de inicio */
.estado{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:var(--panel);font-weight:500;margin-bottom:18px}
.estado i{width:10px;height:10px;border-radius:50%;background:var(--alerta)}
.estado.abierta i{background:var(--ok)}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.cifra{background:var(--panel);border-left:4px solid var(--amarillo);border-radius:8px;padding:14px}
.cifra b{display:block;font-size:1.55rem;font-weight:800}
.cifra span{color:var(--gris);font-size:.82rem}
.accesos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.accesos button{background:var(--amarillo);color:var(--negro);font-weight:700;padding:18px 12px;
  border-radius:10px;font-size:1rem}
.accesos button.sec{background:var(--panel);color:var(--blanco);border:1px solid var(--linea)}
.pendiente{background:var(--panel);border:1px dashed var(--linea);border-radius:10px;padding:26px;color:var(--gris)}

@media (min-width:900px){
  #app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
  header{grid-column:1/3}
  nav{grid-row:2;grid-column:1;flex-direction:column;overflow-y:auto;border-top:0;border-right:1px solid var(--linea)}
  nav button{flex:0 0 auto;flex-direction:row;gap:12px;padding:14px 18px;font-size:.95rem;
    border-top:0;border-left:4px solid transparent}
  nav button.activo{border-left-color:var(--amarillo)}
  main{grid-row:2;grid-column:2;padding:28px}
}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
</style>
</head>
<body>

<div id="splash">
  <img src="icon-512.png" alt="SANS">
  <p>Burgers hechas para ti</p>
</div>

<div id="app">
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>SANS</h1><small>Burgers hechas para ti</small></div>
    <button id="instalar">Instalar app</button>
  </header>
  <main><div class="vista" id="vista"></div></main>
  <nav id="menu" aria-label="Menú principal"></nav>
</div>

<script>
/* ---------- Datos (por ahora en este dispositivo; luego se pueden pasar a la nube) ---------- */
const CLAVE = 'sans-pos-v1';
function cargar(){
  try { return JSON.parse(localStorage.getItem(CLAVE)) || vacio(); } catch(e){ return vacio(); }
}
function vacio(){ return { caja:null, pedidos:[], productos:[], mesas:[] }; }
function guardar(d){ try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){} }
const datos = cargar();
const soles = n => 'S/ ' + Number(n||0).toFixed(2);
const hoy = () => new Date().toISOString().slice(0,10);

/* ---------- Menú ---------- */
const ico = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const SECCIONES = [
  {id:'inicio',   nombre:'Inicio',        parte:1, i:ico('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>')},
  {id:'mesas',    nombre:'Mesas',         parte:2, i:ico('<rect x="3" y="8" width="18" height="3" rx="1"/><path d="M6 11v9M18 11v9"/>')},
  {id:'pedidos',  nombre:'Pedidos',       parte:2, i:ico('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>')},
  {id:'productos',nombre:'Productos',     parte:2, i:ico('<path d="M4 11h16a8 8 0 0 0-16 0z"/><path d="M4 15h16M5 19h14"/>')},
  {id:'caja',     nombre:'Caja',          parte:3, i:ico('<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>')},
  {id:'inventario',nombre:'Inventario',   parte:5, i:ico('<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/>')},
  {id:'reportes', nombre:'Reportes',      parte:4, i:ico('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>')},
  {id:'historial',nombre:'Historial',     parte:4, i:ico('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')},
  {id:'config',   nombre:'Configuración', parte:5, i:ico('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>')}
];
const menu = document.getElementById('menu');
menu.innerHTML = SECCIONES.map(s => `<button data-id="${s.id}">${s.i}<span>${s.nombre}</span></button>`).join('');
menu.addEventListener('click', e => { const b = e.target.closest('button'); if(b) ir(b.dataset.id); });

/* ---------- Vistas ---------- */
function vistaInicio(){
  const delDia = datos.pedidos.filter(p => p.pagado && (p.fecha||'').startsWith(hoy()));
  const total = delDia.reduce((a,p) => a + (p.total||0), 0);
  const items = delDia.reduce((a,p) => a + (p.items||[]).reduce((x,i) => x + (i.cant||0), 0), 0);
  const abierta = !!datos.caja;
  return `
    <h2>Inicio</h2>
    <p class="sub">Resumen del día</p>
    <div class="estado ${abierta?'abierta':''}"><i></i>${abierta ? 'Caja abierta · fondo ' + soles(datos.caja.fondo) : 'Caja cerrada'}</div>
    <div class="cifras">
      <div class="cifra"><b>${soles(total)}</b><span>Ventas del día</span></div>
      <div class="cifra"><b>${delDia.length}</b><span>Pedidos</span></div>
      <div class="cifra"><b>${items}</b><span>Productos vendidos</span></div>
      <div class="cifra"><b>${soles(abierta ? datos.caja.fondo : 0)}</b><span>Monto de apertura</span></div>
    </div>
    <div class="accesos">
      <button data-ir="pedidos">Nuevo pedido</button>
      <button class="sec" data-ir="mesas">Ver mesas</button>
      <button class="sec" data-ir="caja">Ir a caja</button>
      <button class="sec" data-ir="reportes">Reportes</button>
    </div>`;
}
function vistaPendiente(s){
  return `<h2>${s.nombre}</h2>
    <p class="sub">Esta sección se construye en la parte ${s.parte}.</p>
    <div class="pendiente">Aún no está lista. Primero dejamos la base publicada en GitHub y funcionando como app.</div>`;
}
const vista = document.getElementById('vista');
function ir(id){
  const s = SECCIONES.find(x => x.id === id) || SECCIONES[0];
  vista.innerHTML = s.id === 'inicio' ? vistaInicio() : vistaPendiente(s);
  menu.querySelectorAll('button').forEach(b => b.classList.toggle('activo', b.dataset.id === s.id));
  document.querySelector('main').scrollTop = 0;
  history.replaceState(null, '', '#' + s.id);
}
vista.addEventListener('click', e => { const b = e.target.closest('[data-ir]'); if(b) ir(b.dataset.ir); });

/* ---------- Arranque ---------- */
ir(location.hash.slice(1) || 'inicio');
window.addEventListener('load', () => setTimeout(() => document.body.classList.add('listo'), 900));

/* ---------- Instalar como app ---------- */
let eventoInstalar;
const botonInstalar = document.getElementById('instalar');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; botonInstalar.style.display = 'block'; });
botonInstalar.addEventListener('click', async () => {
  if(!eventoInstalar) return;
  eventoInstalar.prompt(); await eventoInstalar.userChoice;
  eventoInstalar = null; botonInstalar.style.display = 'none';
});
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
