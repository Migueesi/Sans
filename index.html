<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SANS Burgers · POS</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--negro:#000;--carbon:#141414;--panel:#1d1d1d;--linea:#2e2e2e;--am:#FFC81E;--gris:#9a9a9a;--blanco:#f5f5f0;--ok:#5fd38a;--mal:#ff6b5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--negro);color:var(--blanco);padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
small{display:block;color:var(--gris);font-size:.78rem;font-weight:400;margin-top:2px}
h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
h3{font-size:1rem;margin:18px 0 8px;color:var(--am)}
.sub{color:var(--gris);margin-bottom:16px}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:90;transition:opacity .5s .6s,visibility 0s 1.1s}
#splash img{width:180px;height:180px;border-radius:50%}
#splash p{color:var(--am);font-weight:700}
body.listo #splash{opacity:0;visibility:hidden}
/* Ingreso */
#login{position:fixed;inset:0;background:#000;z-index:60;display:none;overflow:hidden}
#login.on{display:block}
.glow{position:absolute;inset:0;background:radial-gradient(60% 45% at 70% 0%,rgba(255,200,30,.26),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(255,200,30,.12),transparent 70%)}
.lg2{position:relative;height:100%;overflow-y:auto;display:grid;grid-template-columns:1fr}
.lg-izq{display:none}
.lg-der{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 20px;min-height:100%}
.lg-mov{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.lg-logo{width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 3px var(--am),0 0 40px rgba(255,200,30,.35)}
.lg-mov h1{font-size:2.4rem;font-weight:800;color:var(--am);line-height:1;margin-top:12px;letter-spacing:.02em}
.lema{color:var(--gris)}
.pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--linea);border-radius:999px;padding:6px 12px;font-size:.8rem}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.card{width:100%;max-width:380px;background:rgba(29,29,29,.92);border:1px solid var(--linea);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:1.7rem;margin:0}
.card label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--blanco);font-weight:500}
.card input{width:100%;font-size:1rem;color:var(--blanco)}
.pw{position:relative}.pw input{padding-right:48px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--gris);padding:10px}
.pw button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card .btn{width:100%;padding:14px;font-size:1.05rem;box-shadow:0 8px 24px rgba(255,200,30,.25)}
.enlace{color:var(--am);font-weight:500;text-align:center;font-size:.9rem;padding:4px}
.lg-der>small{text-align:center}
@media(min-width:900px){
 .lg2{grid-template-columns:1.1fr 1fr}
 .lg-mov{display:none}
 .lg-izq{display:flex;flex-direction:column;justify-content:space-between;padding:40px 56px;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px}
 .marca{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.3rem;color:var(--am)}
 .marca img{width:48px;height:48px;border-radius:50%}
 .lg-izq h2{font-size:2.5rem;font-weight:800;line-height:1.15;margin-bottom:24px}
 .checks{list-style:none;display:flex;flex-direction:column;gap:12px;max-width:460px}
 .checks li{background:rgba(255,255,255,.07);border:1px solid var(--linea);border-radius:12px;padding:13px 16px;display:flex;gap:10px;align-items:center}
 .checks li::before{content:'\2713';color:var(--am);font-weight:800}
 .pie{color:var(--gris);font-size:.9rem}
}
/* App */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--carbon);border-bottom:3px solid var(--am)}
header img{width:44px;height:44px;border-radius:50%}
header h1{font-size:1.25rem;font-weight:800;color:var(--am);line-height:1}
header .der{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--linea);padding:7px 12px;border-radius:999px;font-size:.82rem}
#instalar{display:none;background:var(--am);color:#000;font-weight:700;border:0}
main{overflow-y:auto;padding:18px 16px 28px}
.vista{max-width:980px;margin:0 auto}
nav{display:flex;overflow-x:auto;background:var(--carbon);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;font-size:.72rem;color:var(--gris);border-top:3px solid transparent}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.activo{color:var(--am);border-top-color:var(--am)}
.btn{background:var(--am);color:#000;font-weight:700;padding:12px 16px;border-radius:10px;border:1px solid var(--am)}
.btn.sec{background:var(--panel);color:var(--blanco);border-color:var(--linea)}
.btn.peligro{background:transparent;color:var(--mal);border-color:var(--mal)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:12px;min-width:0}
.fila-b{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.acc .btn{padding:8px 12px;font-size:.85rem}.acc select{padding:8px}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.cifra{background:var(--panel);border-left:4px solid var(--am);border-radius:8px;padding:14px}
.cifra b{display:block;font-size:1.5rem;font-weight:800}.cifra span{color:var(--gris);font-size:.82rem}
.metodos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.mesas,.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mesa,.prod{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.mesa b{font-size:1.1rem}.mesa span,.prod span{color:var(--gris);font-size:.85rem}
.mesa.ocupada{background:var(--am);color:#000;border-color:var(--am)}.mesa.ocupada span{color:#000;font-weight:700}
.mesa.nueva{background:transparent;border-style:dashed;color:var(--am)}.mesa.nueva b{font-size:1.5rem}
.prod{text-align:left;padding:12px}.prod:disabled{opacity:.4}
.ped{display:grid;gap:16px;margin-top:8px}
.orden{background:var(--panel);border-radius:12px;padding:14px;align-self:start}
.orden input{width:100%;margin-bottom:8px}
.linea{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.cant{display:flex;align-items:center;gap:10px}
.cant button{width:34px;height:34px;border-radius:8px;background:var(--carbon);border:1px solid var(--linea);font-size:1.2rem}
.tot{display:flex;justify-content:space-between;font-size:1.2rem;padding-top:12px}
.cobro input{width:100%;margin-bottom:8px}
.pendiente{background:var(--panel);border:1px dashed var(--linea);border-radius:10px;padding:24px;color:var(--gris)}
.estado{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);margin-bottom:16px}
.estado i{width:10px;height:10px;border-radius:50%;background:var(--mal)}.estado.abierta i{background:var(--ok)}
.panel{background:var(--panel);border-radius:12px;padding:16px;margin:12px 0}
.panel input{width:100%;margin-bottom:8px}
.dens{margin-bottom:4px}
.den{display:grid;grid-template-columns:1fr 84px 92px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea);font-size:.92rem}
.den input{margin:0;padding:9px;text-align:center}.den b{text-align:right}
.dif{font-weight:700}.dif.ok{color:var(--ok)}.dif.sob{color:var(--am)}.dif.fal{color:var(--mal)}
button.fila{width:100%;text-align:left;border:0;color:inherit}
.cifra.grande{border-left-color:var(--ok)}.cifra.grande b{font-size:1.9rem}
.mv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea);font-size:.9rem}
.mv .neg{color:var(--mal)}.mv .pos{color:var(--ok)}.mv .tenue{color:var(--gris)}
.secc{background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:12px}.secc h3{margin:0 0 6px}
.barra{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:.92rem}
.barra .fondo{grid-column:1/3;height:6px;background:var(--carbon);border-radius:4px;overflow:hidden}
.barra .fondo i{display:block;height:100%;background:var(--am)}
.rangos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.rangos .btn{padding:8px 14px;font-size:.88rem}
.fechas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.fechas input{padding:9px}.fechas .btn{padding:9px 14px}
.dos{display:grid;gap:12px}@media(min-width:900px){.dos{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem}.chk input{width:auto;margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.modal-c{background:var(--carbon);border:1px solid var(--linea);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.modal{align-items:center}.modal-c{border-radius:18px}}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{background:var(--panel);border:1px solid var(--linea);border-radius:999px;padding:10px 16px;font-weight:500}
.op small{display:inline;color:inherit;opacity:.75}
.op.on{background:var(--am);color:#000;border-color:var(--am);font-weight:700}.op:disabled{opacity:.4}
.tit{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 0 4px}.tit b{color:var(--am)}.tit small{margin:0}
.linea .info{flex:1;min-width:0}.linea .cant{flex:none}.linea.bor{align-items:flex-start}.linea .chk input{width:22px;height:22px;accent-color:var(--am);margin:0}
.nota{background:#2a2410;border:1px solid #6b5a14;color:var(--am);border-radius:8px;padding:5px 9px;font-size:.85rem;margin:6px 0}
.btn.chico{padding:6px 12px;font-size:.82rem;margin-top:6px}.cant .btn.chico{margin-top:0}
.mesa.conbor{border-color:var(--am)}.mesa .bdg{color:var(--am);font-weight:700}.mesa.ocupada .bdg{color:#000}
.modal-c textarea{width:100%;background:var(--panel);border:2px solid var(--am);border-radius:10px;padding:12px;color:var(--blanco);font:inherit;resize:none;margin-bottom:6px}

:root{--ease:cubic-bezier(.22,1,.36,1)}
button{transition:transform .12s var(--ease),background-color .2s,border-color .2s,opacity .2s,color .2s}
button:not(:disabled):active{transform:scale(.96)}
.mtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}.mtop .mt{flex:1;min-width:0}.mtop h2{margin:0;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mtop>.btn{padding:10px 12px}
.pill-cta{background:var(--panel);border:1px solid var(--linea);border-radius:999px;padding:10px 12px;font-size:.8rem;color:var(--blanco);white-space:nowrap}.pill-cta b{color:var(--am)}
.cliente{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.buscar{position:relative;margin-bottom:10px}.buscar input{width:100%;padding:12px 44px 12px 42px;border-radius:12px}
.buscar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gris);fill:none;stroke-width:2;stroke-linecap:round}
.buscar .qx{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;color:var(--gris);font-size:1.4rem}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:40px;padding:0 16px;border-radius:999px;background:var(--panel);border:1px solid var(--linea);color:var(--blanco);white-space:nowrap}
.cat.on{background:var(--am);border-color:var(--am);color:#000;font-weight:700}
.bdg2{position:absolute;top:8px;right:8px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--am);color:#000;font-style:normal;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.prod{position:relative}.prod.tiene b{padding-right:32px}
.barra-bor{position:sticky;bottom:10px;margin-top:16px;z-index:20;display:flex;align-items:center;gap:12px;background:#0d0d0d;border:1px solid var(--am);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.65);cursor:pointer}
.barra-bor .bt{flex:1}.barra-bor small{color:var(--am);margin:0}.barra-bor .bm{font-size:1.1rem}
.back{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:70}
.sheet{position:fixed;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--carbon);border:1px solid var(--linea);border-radius:22px 22px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:71;box-shadow:0 -12px 40px rgba(0,0,0,.6);overscroll-behavior:contain}
.grip{width:100px;height:24px;margin:0 auto;display:flex;align-items:center;justify-content:center;touch-action:none}.grip::before{content:'';width:44px;height:5px;border-radius:3px;background:#3a3a3a}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.sh-top h2{margin:0;font-size:1.25rem}.amb{color:var(--am)}
.link{color:var(--gris);text-decoration:underline;padding:10px 6px}.link:disabled{opacity:.4}
.btn.grande{width:100%;padding:16px;font-size:1.05rem;margin-top:10px}
.lineas{background:#3a1512;border-radius:12px;overflow:hidden}.linea.bor,.lineas .linea{background:var(--carbon)}.lineas .linea{padding:10px 0}
.linea.sale{transform:translateX(-120%)!important;opacity:0!important;transition:transform .19s ease-in,opacity .19s!important}
.avi{display:block;margin-top:8px}
.sheet input{width:100%}
.modal{z-index:80}
.exito{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;pointer-events:none;background:rgba(0,0,0,.55)}
.exito svg{width:104px;height:104px;stroke:var(--am);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.exito b{font-size:1.2rem;text-align:center;padding:0 24px}
.sk{background:linear-gradient(90deg,#1d1d1d 25%,#2a2a2a 50%,#1d1d1d 75%);background-size:200% 100%;border-radius:12px}
.btn.cargando::after{content:'';width:15px;height:15px;border:2px solid #000;border-top-color:transparent;border-radius:50%;display:inline-block;margin-left:10px;vertical-align:-3px}
@media (prefers-reduced-motion:no-preference){
@keyframes subir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.93)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes entra{from{transform:translateY(140%);opacity:0}60%{transform:translateY(-6px);opacity:1}to{transform:none}}
@keyframes abre{from{transform:translateY(100%)}to{transform:none}}
@keyframes fundir{from{opacity:0}to{opacity:1}}
@keyframes lineain{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes check{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes aro{from{stroke-dashoffset:150}to{stroke-dashoffset:0}}
@keyframes latido{0%,100%{transform:scale(1)}40%{transform:scale(1.16)}}
@keyframes brillo{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes girar{to{transform:rotate(1turn)}}
.lista-in>*{animation:subir .4s var(--ease) both}
.lista-in .mesa,.lista-in .prod,.lista-in .fila{animation:subir .45s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
.prod.pop{animation:pop .45s var(--ease)}
.bdg2.bump,.cant b.bump{animation:bump .4s var(--ease)}
.barra-bor.entra{animation:entra .6s var(--ease)}
.sheet.abre{animation:abre .36s var(--ease)}.back.abre{animation:fundir .25s}
.sheet.cierra{animation:none;transition:transform .22s ease-in;transform:translateY(100%)}.back.cierra{animation:none;opacity:0;transition:opacity .22s}
.modal-c.abre{animation:abre .32s var(--ease)}
.linea.in{animation:lineain .35s var(--ease)}
.exito{animation:fundir .15s}.exito svg circle{stroke-dasharray:150;animation:aro .5s ease-out both}.exito svg path{stroke-dasharray:60;animation:check .4s .35s ease-out both}.exito b{animation:subir .4s .5s both}
.pill-cta.latido{animation:latido .6s .2s}
.sk{animation:brillo 1.3s linear infinite}
#splash img{animation:flotar 2.2s ease-in-out infinite}
.btn.cargando::after{animation:girar .7s linear infinite}
.mesa.ocupada{animation:fundir .4s}
}

.vista.ancho{max-width:none}
.kbd{display:inline-block;margin-left:8px;font-size:.7rem;border:1px solid #4a4a4a;border-radius:5px;padding:1px 6px;font-weight:500;opacity:.75}
.btn .kbd{border-color:currentColor}
/* conteo interactivo */
.den{grid-template-columns:1fr auto 96px;transition:background-color .2s}
.den .dn{display:flex;align-items:center;gap:9px}.den .dn i{width:11px;height:11px;border-radius:6px;flex:none}
.stp{display:flex;align-items:center;gap:6px}.stp .dm{width:36px;height:36px;border-radius:9px;background:var(--carbon);border:1px solid var(--linea);font-size:1.1rem}
.den input{width:60px;margin:0;padding:8px 4px;text-align:center}
.den:not(.con) b{color:#6a6a6a}.den.con{background:rgba(255,200,30,.06)}
.cbar{height:10px;border-radius:5px;background:#0d0d0d;overflow:hidden;margin:14px 0 8px}
.cbar i{display:block;height:100%;width:0;background:var(--gris);transition:width .35s var(--ease),background-color .25s}
.cbar i.fal{background:var(--mal)}.cbar i.ok{background:var(--ok)}.cbar i.sob{background:var(--am)}
.cfila{display:flex;justify-content:space-between;align-items:baseline}
.conteo{display:none;background:var(--panel);border-radius:18px;padding:18px 20px;margin:12px 0}.conteo.on{display:block}
.cajapc{display:grid;gap:14px}
.cj-a,.cj-b{min-width:0}
/* asistente */
.asis{background:var(--panel);border-radius:18px;padding:16px 18px;margin:14px 0}
.asis-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}.asis-h small{margin:0}
.asis-av{width:38px;height:38px;border-radius:50%;background:var(--am);display:flex;align-items:center;justify-content:center;flex:none}.asis-av svg{width:20px;height:20px;fill:#000}
.ins{border-radius:12px;padding:11px 14px;font-size:.92rem;line-height:1.4;margin:10px 0}
.ins.rojo{background:#2a1512;border:1px solid #6b2a22}.ins.rojo b{color:var(--mal)}
.ins.ambar{background:#2a2410;border:1px solid #6b5a14}.ins.ambar b{color:var(--am)}
.ins.ok{background:#14261b;border:1px solid #245a3a}.ins.ok b{color:var(--ok)}
.aviso{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--carbon);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.aviso .at{flex:1;min-width:200px;font-size:.9rem;line-height:1.35}.aviso .ab{display:flex;gap:8px;flex-wrap:wrap}
.pt{width:10px;height:10px;border-radius:5px;flex:none}.pt.rojo{background:var(--mal)}.pt.ambar{background:var(--am)}
.asis-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.asis textarea{width:100%;background:var(--carbon);border:1px solid var(--linea);border-radius:10px;padding:12px;color:var(--blanco);font:inherit;resize:vertical;margin:6px 0}
.asis-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cod{display:block;background:#0d0d0d;border:1px solid var(--linea);border-radius:8px;padding:10px;font-size:.8rem;word-break:break-all;margin:6px 0}
/* cobro */
.metodos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.metodo{height:62px;border-radius:12px;background:var(--panel);border:1px solid var(--linea);color:var(--blanco);font-weight:700}.metodo.on{background:var(--am);border-color:var(--am);color:#000}
.rapidos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.vuelto-r{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin:6px 0 2px}.vuelto-r b{font-size:2rem;color:var(--ok)}
/* PC */
.pcm{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:24px;align-items:start}
.pcm-panel{position:sticky;top:0;max-height:calc(100vh - 110px);overflow-y:auto;background:var(--carbon);border:1px solid var(--linea);border-radius:18px;padding:16px 20px}
.pcm-sep{height:1px;background:var(--linea);margin:18px 0}
.cant .btn.chico{width:auto;height:auto;padding:8px 12px;font-size:.82rem;border-radius:10px;margin:0}
.pcm-carta .prods{grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
.pcm-carta .prod{min-height:92px}
@media(min-width:1100px){
 .cajapc{grid-template-columns:minmax(0,1fr) 470px;grid-template-areas:"a c" "b c";column-gap:22px;align-items:start}
 .cj-a{grid-area:a}.cj-b{grid-area:b}
 .conteo{display:block;grid-area:c;position:sticky;top:0;max-height:calc(100vh - 110px);overflow-y:auto;margin:0}
 .cifra.grande{grid-column:span 2}.cifra.grande b{font-size:2.4rem;color:var(--ok)}
}
@media (prefers-reduced-motion:no-preference){
@keyframes flash{0%{color:var(--am);transform:scale(1.14)}100%{transform:none}}
@keyframes cuadra{0%{box-shadow:0 0 0 0 rgba(95,211,138,.7)}100%{box-shadow:0 0 0 22px rgba(95,211,138,0)}}
.den b.flash{display:inline-block;animation:flash .45s var(--ease)}
.conteo.cuadra{animation:cuadra .9s ease-out}
}

.perm{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--linea)}.perm:last-child{border-bottom:0}
.perm .pt2{flex:1;min-width:0}.perm .pt2 small{display:block;margin-top:4px;line-height:1.35}.perm .tenue{color:#6a6a6a}
.sw{flex:none;width:58px;height:34px;border-radius:17px;background:#2e2e2e;position:relative;border:1px solid #444;transition:background-color .25s,border-color .25s}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#bbb;transition:transform .25s var(--ease),background-color .25s}
.sw.on{background:var(--am);border-color:var(--am)}.sw.on i{transform:translateX(24px);background:#000}
.reg{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linea)}.reg:last-child{border-bottom:0}
.reg .pt{margin-top:6px}.reg .rt{flex:1;font-size:.92rem;line-height:1.4}.reg .rol{color:var(--gris);font-size:.78rem;border:1px solid var(--linea);border-radius:6px;padding:0 6px}
.pt.ok{background:var(--ok)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--am);color:#000;font-weight:700;padding:12px 18px;border-radius:14px;z-index:95;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:900px){
 #app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
 header{grid-column:1/3}
 nav{grid-row:2;grid-column:1;flex-direction:column;overflow-y:auto;border-top:0;border-right:1px solid var(--linea)}
 nav button{flex:0 0 auto;flex-direction:row;gap:12px;padding:14px 18px;font-size:.95rem;border-top:0;border-left:4px solid transparent}
 nav button.activo{border-left-color:var(--am)}
 main{grid-row:2;grid-column:2;padding:28px}
 .ped{grid-template-columns:1.5fr 1fr}.ped .orden{grid-column:2;grid-row:1}.ped .cat{grid-column:1;grid-row:1}
}
@media(prefers-reduced-motion:reduce){#splash,#toast{transition:none}}

<script>

const DOMINIO='sans-pos.app',VERSION='v12',SAL='-sans-pos';

let P=null,V={id:'inicio'},busy=false,rt=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soles=n=>'S/ '+Number(n||0).toFixed(2);

let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}
const catsLista=()=>{const n=D.categorias.map(c=>c.nombre);D.productos.forEach(x=>{if(!n.includes(x.categoria))n.push(x.categoria)});return n};

const conItems=p=>p&&p.items.length>0;

const inicioDia=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

async function cargarTodo(){
  const cj=await sb.from('cajas').select('*').order('abierta_en',{ascending:false}).limit(15);
  if(cj.error)throw cj.error;
  D.caja=cj.data.find(c=>c.estado==='abierta')||null;
  D.cajas=cj.data.filter(c=>c.estado==='cerrada');
  const cid=D.caja&&D.caja.id;
  const orf=`estado.eq.abierto,and(estado.eq.pagado,pagado_en.gte.${inicioDia().toISOString()})`+(cid?`,caja_id.eq.${cid}`:'');
  const [pr,me,pe,mv,op_,ct,bo,pg,pm]=await Promise.all([
    sb.from('productos').select('*').order('categoria').order('nombre'),
    sb.from('mesas').select('*').order('orden'),
    sb.from('pedidos').select('*, pedido_items(*)').or(orf),
    cid?sb.from('caja_movimientos').select('*').eq('caja_id',cid).order('creado'):Promise.resolve({data:[],error:null}),
    sb.from('opciones').select('*').order('nombre'),
    sb.from('categorias').select('*').order('orden').order('nombre'),
    sb.from('borradores').select('*').order('creado'),
    (cid&&esAdmin())?sb.from('pagos_recibidos').select('*').gte('recibido_en',D.caja.abierta_en).order('recibido_en'):Promise.resolve({data:[],error:null}),
    sb.from('permisos').select('*')
  ]);
  const er=pr.error||me.error||pe.error||mv.error||op_.error||ct.error||bo.error||pg.error||pm.error;if(er)throw er;
  D.productos=pr.data;D.mesas=me.data;D.movs=mv.data;D.opciones=op_.data;D.categorias=ct.data;D.pagos=pg.data;D.permisos=pm.data;D.perm=Object.fromEntries(pm.data.map(x=>[x.clave,x.activo]));if(Qn.n===0)D.borr=bo.data;
  D.pedidos=pe.data.map(p=>({...p,items:(p.pedido_items||[]).sort((a,b)=>a.creado.localeCompare(b.creado))}));
}
async function op(fn,ok){
  if(busy)return;busy=true;
  try{const r=await fn();if(r&&r.error)throw r.error;await cargarTodo();if(ok)toast(ok)}
  catch(e){toast(msg(e))}
  finally{busy=false;render()}
}
const escribiendo=()=>{const a=document.activeElement;return a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$('vista').contains(a)};
function suscribir(){
  if(rt)return;let t;
  const f=()=>{clearTimeout(t);t=setTimeout(async function run(){if(Qn.n>0||V.confirmando){t=setTimeout(run,600);return}try{await cargarTodo();if(!escribiendo())render()}catch(e){}},350)};
  rt=sb.channel('sans');
  ['pedidos','pedido_items','productos','mesas','cajas','caja_movimientos','opciones','categorias','borradores','pagos_recibidos','permisos'].forEach(tb=>rt.on('postgres_changes',{event:'*',schema:'public',table:tb},f));
  rt.subscribe();
}
async function fn(body){
  const {data,error}=await sb.functions.invoke('usuarios',{body});
  if(error){let m=error.message;try{const j=await error.context.json();if(j.error)m=j.error}catch(_){}throw new Error(m)}
  if(data&&data.error)throw new Error(data.error);return data;
}

 {id:'inicio',n:'Inicio',r:['caja','admin'],i:ico('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>')},

function inicio(){
  const c=D.caja;
  const pag=D.pedidos.filter(p=>p.estado==='pagado'&&(c?p.caja_id===c.id:true));
  const tot=pag.reduce((a,p)=>a+p.total,0);
  const it=pag.reduce((a,p)=>a+p.items.reduce((x,i)=>x+i.cant,0),0);

  const p=pedidoMesa(m.id),oc=conItems(p),nb=D.borr.filter(b=>b.mesa_id===m.id&&b.autor_id===P.id).length;

  const lbl={salon:'Agregar mesa',llevar:'Agregar recojo',delivery:'Agregar delivery'};

const lineaC=i=>`<div class="linea conf"><div class="info"><b>${i.producto_id?i.cant+' × ':''}${esc(i.nombre)}</b>${i.detalle?`<small>${esc(i.detalle)}</small>`:''}${i.nota?`<div class="nota">Nota: ${esc(i.nota)}</div>`:''}<small>${soles(i.precio)}${i.producto_id?' c/u · Enviado a cocina':''}</small></div><div class="cant">${i.producto_id?`<button class="btn sec chico" data-a="repetir" data-v="${i.id}">Repetir</button>`:''}${(can('quitar_enviado')||!i.enviado)?`<button class="btn peligro chico" data-a="quitar" data-v="${i.id}">Quitar</button>`:''}</div></div>`;
function lineaB(b,propio,nosel,fx){
  const k=kid(b);

const LUPA='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
function bloqueBor(mis,sel,totSel,fx){
  const nosel=V.nosel||[],ped=D.pedidos.find(p=>p.estado==='abierto'&&p.mesa_id===V.mesa),dv=V.datos||{},nota=ped&&ped.nota!=null?ped.nota:(dv.nota||''),u=mis.reduce((a,b)=>a+b.cant,0);
  return `<div class="sh-top"><div><h2>Tu pedido</h2><small class="amb">${mis.length?`${u} producto${u===1?'':'s'} · sin confirmar`:'Aún no sale a cocina'}</small></div><button class="link" data-a="vaciarBor" ${mis.length?'':'disabled'}>Vaciar</button></div>
  <div class="lineas">${mis.map(b=>lineaB(b,true,nosel,fx)).join('')||'<p class="sub" style="padding:12px">Sin productos. Toca uno de la carta para agregarlo.</p>'}</div>
  <input data-campo="nota" placeholder="Nota general del pedido (opcional)" value="${esc(nota)}" style="margin-top:12px">
  <div class="tot bor"><span>Por confirmar</span><b id="bor-total" data-count="${totSel}" data-ck="bor">${soles(totSel)}</b></div>
  <button class="btn grande ${V.confirmando?'cargando':''}" data-a="confirmar" ${sel.length&&!V.confirmando?'':'disabled'}>${V.confirmando?'Enviando…':`Confirmar y enviar a cocina (${sel.length})`}${esPC()?'<span class="kbd" aria-hidden="true">Enter</span>':''}</button>`;

const MET=['efectivo','yape','plin','tarjeta'],cap=t=>t?t[0].toUpperCase()+t.slice(1):'—';
const isoD=d=>d.toLocaleDateString('en-CA');
const dia0=t=>new Date(t+'T00:00:00');
const sumP=a=>a.reduce((x,p)=>x+p.total,0);
const totalA=p=>p.items.reduce((a,i)=>a+i.precio*i.cant,0);
const barra=(l,v,max,txt)=>`<div class="barra"><span>${l}</span><b>${txt||soles(v)}</b><div class="fondo"><i style="width:${max?Math.round(v/max*100):0}%"></i></div></div>`;
const agrupar=(arr,kf,vf)=>{const o={};arr.forEach(x=>{const k=kf(x)||'—';o[k]=(o[k]||0)+vf(x)});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
function rangoRep(){
  const h=new Date();h.setHours(0,0,0,0);let a=new Date(h),b=new Date(h);const r=(V.rep&&V.rep.r)||'hoy';
  if(r==='ayer'){a.setDate(a.getDate()-1);b=new Date(a)}
  else if(r==='7d'){a.setDate(a.getDate()-6)}
  else if(r==='mes'){a.setDate(1)}
  else if(r==='mesp'){a=new Date(h.getFullYear(),h.getMonth()-1,1);b=new Date(h.getFullYear(),h.getMonth(),0)}
  else if(r==='custom'&&V.rep.d&&V.rep.h){a=dia0(V.rep.d);b=dia0(V.rep.h)}
  return {a,b};
}
async function paginar(mk){let out=[],i=0;for(;;){const r=await mk().range(i,i+999);if(r.error)return r;out=out.concat(r.data);if(r.data.length<1000)return {data:out,error:null};i+=1000}}
async function cargarRango(a,b){
  const ini=a.toISOString(),fin=new Date(b.getFullYear(),b.getMonth(),b.getDate()+1).toISOString();
  const [pe,an,cj,mv]=await Promise.all([
    paginar(()=>sb.from('pedidos').select('*, pedido_items(*)').eq('estado','pagado').gte('pagado_en',ini).lt('pagado_en',fin).order('pagado_en')),
    paginar(()=>sb.from('pedidos').select('*, pedido_items(*)').eq('estado','anulado').gte('anulado_en',ini).lt('anulado_en',fin).order('anulado_en')),
    paginar(()=>sb.from('cajas').select('*').eq('estado','cerrada').gte('cerrada_en',ini).lt('cerrada_en',fin).order('cerrada_en')),
    paginar(()=>sb.from('caja_movimientos').select('*').gte('creado',ini).lt('creado',fin).order('creado'))
  ]);
  const er=pe.error||an.error||cj.error||mv.error;if(er){toast(msg(er));return}
  const con=p=>({...p,items:p.pedido_items||[]});
  D.rep={pedidos:pe.data.map(con),anulados:an.data.map(con),cajas:cj.data,movs:mv.data};
}
async function cargarRep(){

}

function tocar(l){if(!l._sync)l._sync={cant:l.cant,nota:l.nota||null}}
async function sincLinea(l){
  if(l._del){if(!l._tmp&&l.id){const r=await sb.from('borradores').delete().eq('id',l.id);if(r.error)throw r.error}return}
  if(l._tmp){
    const c0=l.cant,n0=l.nota||null;
    const r=await sb.from('borradores').insert({mesa_id:l.mesa_id,autor_id:l.autor_id,autor_nombre:l.autor_nombre,producto_id:l.producto_id,nombre:l.nombre,precio:l.precio,cant:c0,detalle:l.detalle,opciones:l.opciones,nota:n0}).select().single();
    if(r.error)throw r.error;l.id=r.data.id;l._tmp=false;l._sync={cant:c0,nota:n0};return;
  }
  const sy=l._sync||{};if(sy.cant===l.cant&&(sy.nota||null)===(l.nota||null))return;
  const c=l.cant,n=l.nota||null,r=await sb.from('borradores').update({cant:c,nota:n}).eq('id',l.id);
  if(r.error)throw r.error;l._sync={cant:c,nota:n};
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});

document.addEventListener('keydown',e=>{
  const t=e.target,suelto=document.activeElement===document.body||t===document.body;
  if(t.dataset&&t.dataset.pre){
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();return A[e.key==='ArrowUp'?'denMas':'denMenos'](t.dataset.pre+'|'+t.dataset.den)}
    if(e.key==='Enter'){e.preventDefault();const all=[...document.querySelectorAll(`[data-pre="${t.dataset.pre}"]`)],i=all.indexOf(t);(all[i+1]||all[0]).focus();return}
  }
  if(suelto&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(V.id==='caja'&&D.caja){const mp={i:'ingreso',r:'retiro',g:'gasto',d:'devolucion'}[String(e.key).toLowerCase()];if(mp){e.preventDefault();return A.movAbrir(mp)}}
    if(V.id==='mesas'&&V.mesa&&!V.cfg&&!V.nota){
      if(e.key==='/'){e.preventDefault();const q=$('q');if(q)q.focus();return}
      if(e.key==='Enter'&&esPC()&&D.borr.some(b=>b.mesa_id===V.mesa&&b.autor_id===P.id&&!b._del)){e.preventDefault();return A.confirmar()}
      if(e.key==='F2'){e.preventDefault();return A.cobrarAbrir()}
      if(V.cobro&&/^[1-4]$/.test(e.key)){e.preventDefault();return A.metodo(['efectivo','yape','plin','tarjeta'][+e.key-1])}
    }
  }
  if(e.key==='Enter'&&t.dataset&&t.dataset.enter)return A[t.dataset.enter]();
  if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset.a&&A[t.dataset.a]){e.preventDefault();return A[t.dataset.a](t.dataset.v)}
  if(e.key==='Escape'){if(V.nota)return A.bNotaCancelar();if(V.cfg)return A.cfgCancelar();if(V.sheet)return cerrar()}
});
let sw=null,gr=null;
document.addEventListener('touchstart',e=>{
  const t=e.touches[0],g=e.target.closest('[data-grip]');
  if(g){gr={sh:document.querySelector('.sheet'),y:t.clientY,dy:0};return}
  const l=e.target.closest('.linea.bor[data-k]');if(!l||e.target.closest('button,input,textarea,label'))return;
  sw={l,x:t.clientX,y:t.clientY,dx:0,on:false};
},{passive:true});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  if(gr&&gr.sh){gr.dy=Math.max(0,t.clientY-gr.y);gr.sh.style.transform=`translateY(${gr.dy}px)`;return}
  if(!sw)return;const dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.on&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))sw.on=true;
  if(sw.on){sw.dx=Math.min(0,dx);sw.l.style.transition='none';sw.l.style.transform=`translateX(${sw.dx}px)`;sw.l.style.opacity=String(Math.max(.3,1+sw.dx/300))}
},{passive:true});
document.addEventListener('touchend',()=>{
  if(gr){const g=gr;gr=null;if(g.sh){if(g.dy>110)cerrar();else{g.sh.style.transition='transform .2s';g.sh.style.transform=''}}return}
  if(!sw)return;const {l,dx,on}=sw;sw=null;
  if(on&&dx<-90){l.classList.add('sale');setTimeout(()=>A.bQuitar(l.dataset.k),190)}
  else{l.style.transition='transform .2s,opacity .2s';l.style.transform='';l.style.opacity=''}
});
