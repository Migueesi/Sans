<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SANS Burgers · POS</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--negro:#000;--carbon:#141414;--panel:#1d1d1d;--linea:#2e2e2e;--am:#FFC81E;--gris:#9a9a9a;--blanco:#f5f5f0;--ok:#5fd38a;--mal:#ff6b5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--negro);color:var(--blanco);padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
small{display:block;color:var(--gris);font-size:.78rem;font-weight:400;margin-top:2px}
h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
h3{font-size:1rem;margin:16px 0 8px;color:var(--am)}
.sub{color:var(--gris);margin-bottom:16px}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:90;transition:opacity .5s .6s,visibility 0s 1.1s}
#splash img{width:180px;height:180px;border-radius:50%}
#splash p{color:var(--am);font-weight:700}
body.listo #splash{opacity:0;visibility:hidden}
#login{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;overflow-y:auto}
#login.on{display:flex}
#login img{width:120px;height:120px;border-radius:50%}
#login input{width:100%;max-width:320px}
.quien{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px}
.quien .btn{min-width:140px}
.quien .btn.sel{border-color:var(--am);color:var(--am)}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--carbon);border-bottom:3px solid var(--am)}
header img{width:44px;height:44px;border-radius:50%}
header h1{font-size:1.25rem;font-weight:800;color:var(--am);line-height:1}
header .der{margin-left:auto;display:flex;gap:8px}
.chip{background:var(--panel);border:1px solid var(--linea);padding:7px 12px;border-radius:999px;font-size:.82rem}
#instalar{display:none;background:var(--am);color:#000;font-weight:700;border:0}
main{overflow-y:auto;padding:18px 16px 28px}
.vista{max-width:980px;margin:0 auto}
nav{display:flex;overflow-x:auto;background:var(--carbon);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;font-size:.72rem;color:var(--gris);border-top:3px solid transparent}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.activo{color:var(--am);border-top-color:var(--am)}
.btn{background:var(--am);color:#000;font-weight:700;padding:12px 16px;border-radius:10px;border:1px solid var(--am)}
.btn.sec{background:var(--panel);color:var(--blanco);border-color:var(--linea)}
.btn.peligro{background:transparent;color:var(--mal);border-color:var(--mal)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:12px;min-width:0}
.fila-b{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.acc{display:flex;flex-wrap:wrap;gap:8px}.acc .btn{padding:8px 12px;font-size:.85rem}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.cifra{background:var(--panel);border-left:4px solid var(--am);border-radius:8px;padding:14px}
.cifra b{display:block;font-size:1.5rem;font-weight:800}.cifra span{color:var(--gris);font-size:.82rem}
.metodos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.mesas,.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mesa,.prod{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.mesa b{font-size:1.1rem}.mesa span,.prod span{color:var(--gris);font-size:.85rem}
.mesa.ocupada{background:var(--am);color:#000;border-color:var(--am)}.mesa.ocupada span{color:#000;font-weight:700}
.prod{text-align:left;padding:12px}.prod:disabled{opacity:.4}
.ped{display:grid;gap:16px;margin-top:8px}
.orden{background:var(--panel);border-radius:12px;padding:14px;align-self:start}
.linea{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.cant{display:flex;align-items:center;gap:10px}
.cant button{width:34px;height:34px;border-radius:8px;background:var(--carbon);border:1px solid var(--linea);font-size:1.2rem}
.tot{display:flex;justify-content:space-between;font-size:1.2rem;padding-top:12px}
.cobro input{width:100%;margin-bottom:8px}
.pendiente{background:var(--panel);border:1px dashed var(--linea);border-radius:10px;padding:24px;color:var(--gris)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--am);color:#000;font-weight:700;padding:12px 18px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:900px){
 #app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
 header{grid-column:1/3}
 nav{grid-row:2;grid-column:1;flex-direction:column;overflow-y:auto;border-top:0;border-right:1px solid var(--linea)}
 nav button{flex:0 0 auto;flex-direction:row;gap:12px;padding:14px 18px;font-size:.95rem;border-top:0;border-left:4px solid transparent}
 nav button.activo{border-left-color:var(--am)}
 main{grid-row:2;grid-column:2;padding:28px}
 .ped{grid-template-columns:1.5fr 1fr}.ped .orden{grid-column:2;grid-row:1}.ped .cat{grid-column:1;grid-row:1}
}
@media(prefers-reduced-motion:reduce){#splash,#toast{transition:none}}
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="SANS"><p>Burgers hechas para ti</p></div>
<div id="login"></div>
<div id="toast" role="status"></div>
<div id="app">
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>SANS</h1><small id="quien">Burgers hechas para ti</small></div>
    <div class="der"><button id="instalar" class="chip">Instalar app</button><button class="chip" data-a="salir">Salir</button></div>
  </header>
  <main><div class="vista" id="vista"></div></main>
  <nav id="menu" aria-label="Menú principal"></nav>
</div>
<script>
/* ===== Datos (en este dispositivo; luego se pueden pasar a la nube) ===== */
const CLAVE='sans-pos-v1';
const MESAS0=()=>Array.from({length:8},(_,i)=>({id:i+1,nombre:'Mesa '+(i+1)}));
function cargar(){
  let d={};try{d=JSON.parse(localStorage.getItem(CLAVE))||{}}catch(e){}
  d=Object.assign({usuarios:[],productos:[],pedidos:[],caja:null},d);
  if(!d.mesas||!d.mesas.length)d.mesas=MESAS0();
  return d;
}
const guardar=()=>{try{localStorage.setItem(CLAVE,JSON.stringify(D))}catch(e){toast('No se pudo guardar en este dispositivo')}};
let D=cargar(),U=null,V={id:'inicio'},sel=null;
const ROLES={admin:'Administrador / encargado',personal:'Mozo / cajero'};
const esAdmin=()=>U&&U.rol==='admin';
const $=id=>document.getElementById(id);
const val=id=>($(id)||{value:''}).value;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soles=n=>'S/ '+Number(n||0).toFixed(2);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const hoyS=()=>new Date().toLocaleDateString('en-CA');
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
const abierto=m=>D.pedidos.find(p=>p.estado==='abierto'&&p.mesa===m);
const totalP=p=>p.items.reduce((a,i)=>a+i.precio*i.cant,0);

/* ===== Menú y permisos ===== */
const ico=d=>`<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const A2=['admin','personal'],A1=['admin'];
const SEC=[
 {id:'inicio',n:'Inicio',r:A2,i:ico('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>')},
 {id:'mesas',n:'Mesas',r:A2,i:ico('<rect x="3" y="8" width="18" height="3" rx="1"/><path d="M6 11v9M18 11v9"/>')},
 {id:'productos',n:'Productos',r:A1,i:ico('<path d="M4 11h16a8 8 0 0 0-16 0z"/><path d="M4 15h16M5 19h14"/>')},
 {id:'usuarios',n:'Usuarios',r:A1,i:ico('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/>')},
 {id:'caja',n:'Caja',r:A2,p:3,i:ico('<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>')},
 {id:'reportes',n:'Reportes',r:A1,p:4,i:ico('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>')},
 {id:'historial',n:'Historial',r:A1,p:4,i:ico('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')}
];

/* ===== Vistas ===== */
function inicio(){
  const pag=D.pedidos.filter(p=>p.estado==='pagado'&&p.fechaPago===hoyS());
  const tot=pag.reduce((a,p)=>a+p.total,0);
  const it=pag.reduce((a,p)=>a+p.items.reduce((x,i)=>x+i.cant,0),0);
  const ocup=D.pedidos.filter(p=>p.estado==='abierto').length;
  const met=['efectivo','yape','plin','tarjeta'].map(m=>`<span class="chip">${m[0].toUpperCase()+m.slice(1)} ${soles(pag.filter(p=>p.metodo===m).reduce((a,p)=>a+p.total,0))}</span>`).join(' ');
  return `<h2>Hola, ${esc(U.nombre)}</h2><p class="sub">Resumen del día</p>
  <div class="cifras"><div class="cifra"><b>${soles(tot)}</b><span>Ventas del día</span></div><div class="cifra"><b>${pag.length}</b><span>Pedidos cobrados</span></div><div class="cifra"><b>${it}</b><span>Productos vendidos</span></div><div class="cifra"><b>${ocup}</b><span>Mesas ocupadas</span></div></div>
  <div class="fila-b" style="margin:0 0 18px">${met}</div>
  <div class="fila-b"><button class="btn" data-a="ir" data-v="mesas">Ver mesas</button>${esAdmin()?'<button class="btn sec" data-a="ir" data-v="productos">Productos</button><button class="btn sec" data-a="ir" data-v="usuarios">Usuarios</button>':''}</div>`;
}
function mesas(){
  if(V.mesa)return pedidoView();
  return `<h2>Mesas</h2><p class="sub">Toca una mesa para tomar o ver su pedido</p><div class="mesas">${D.mesas.map(m=>{const p=abierto(m.id);return `<button class="mesa ${p?'ocupada':''}" data-a="mesa" data-v="${m.id}"><b>${esc(m.nombre)}</b><span>${p?soles(totalP(p)):'Libre'}</span></button>`}).join('')}</div>
  ${esAdmin()?'<div class="fila-b"><button class="btn sec" data-a="mesaAdd">+ Agregar mesa</button><button class="btn sec" data-a="mesaDel">Quitar última mesa</button></div>':''}`;
}
function pedidoView(){
  const m=D.mesas.find(x=>x.id===V.mesa),p=abierto(V.mesa)||{items:[]},tot=totalP(p);
  const cats=[...new Set(D.productos.map(x=>x.cat))];
  const prods=cats.length?cats.map(c=>`<h3>${esc(c)}</h3><div class="prods">${D.productos.filter(x=>x.cat===c).map(x=>`<button class="prod" ${x.agotado?'disabled':''} data-a="add" data-v="${x.id}"><b>${esc(x.nombre)}</b><span>${x.agotado?'Agotado':soles(x.precio)}</span></button>`).join('')}</div>`).join(''):`<div class="pendiente">Aún no hay productos. ${esAdmin()?'Agrégalos en Productos.':'Pide al administrador que los agregue.'}</div>`;
  const lin=p.items.map((i,k)=>`<div class="linea"><div><b>${esc(i.nombre)}</b><small>${i.enviado?'Enviado a cocina':'Por enviar'} · ${soles(i.precio)}</small></div><div class="cant"><button data-a="menos" data-v="${k}" aria-label="Quitar uno">−</button><b>${i.cant}</b><button data-a="mas" data-v="${k}" aria-label="Agregar uno">+</button></div></div>`).join('')||'<p class="sub">Sin productos todavía.</p>';
  const pend=p.items.some(i=>!i.enviado),hay=p.items.length>0;
  return `<button class="btn sec" data-a="volver">← Mesas</button><h2 style="margin-top:12px">${esc(m.nombre)}</h2>
  <div class="ped"><section class="orden">${lin}<div class="tot"><span>Total</span><b>${soles(tot)}</b></div>
  ${V.cobro&&hay?cobroPanel(tot):`<div class="fila-b"><button class="btn" data-a="enviar" ${pend?'':'disabled'}>Enviar a cocina</button><button class="btn" data-a="cobrarAbrir" ${hay?'':'disabled'}>Cobrar</button><button class="btn peligro" data-a="anular" ${hay?'':'disabled'}>Anular pedido</button></div>`}</section>
  <section class="cat">${prods}</section></div>`;
}
function cobroPanel(tot){
  const m=V.metodo||'efectivo';
  const campos=m==='efectivo'?`<input id="recibido" type="number" inputmode="decimal" placeholder="Monto recibido" oninput="vuelto(${tot})"><p>Vuelto: <b id="vuelto">${soles(0)}</b></p>`
   :m==='tarjeta'?`<input id="lote" placeholder="Lote"><input id="codigo" placeholder="Referencia">`:`<input id="codigo" placeholder="Código de operación">`;
  return `<div class="cobro"><h3>Cobrar ${soles(tot)}</h3><div class="metodos">${['efectivo','yape','plin','tarjeta'].map(x=>`<button class="btn ${m===x?'':'sec'}" data-a="metodo" data-v="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${campos}
  <div class="fila-b"><button class="btn" data-a="cobrar">Confirmar cobro</button><button class="btn sec" data-a="cobroCerrar">Cancelar</button></div></div>`;
}
function vuelto(t){const r=parseFloat(val('recibido'))||0;$('vuelto').textContent=soles(Math.max(0,r-t))}
function productos(){
  return `<h2>Productos</h2><p class="sub">Lo que se vende en SANS</p>
  <div class="form"><input id="pn" placeholder="Nombre (ej. Burger clásica)"><input id="pc" list="cats" placeholder="Categoría"><datalist id="cats"><option>Hamburguesas</option><option>Combos</option><option>Bebidas</option><option>Extras</option></datalist><input id="pp" type="number" inputmode="decimal" placeholder="Precio"><button class="btn" data-a="prodAdd">Agregar</button></div>
  ${D.productos.map(x=>`<div class="fila"><div><b>${esc(x.nombre)}</b><small>${esc(x.cat)} · ${soles(x.precio)}${x.agotado?' · Agotado':''}</small></div><div class="acc"><button class="btn sec" data-a="prodPrecio" data-v="${x.id}">Precio</button><button class="btn sec" data-a="prodAgot" data-v="${x.id}">${x.agotado?'Disponible':'Agotado'}</button><button class="btn peligro" data-a="prodDel" data-v="${x.id}">Quitar</button></div></div>`).join('')||'<div class="pendiente">Todavía no hay productos. Agrega el primero arriba.</div>'}`;
}
function usuarios(){
  return `<h2>Usuarios</h2><p class="sub">Quién puede entrar y qué puede hacer</p>
  <div class="form"><input id="un" placeholder="Nombre"><input id="up" type="password" inputmode="numeric" maxlength="4" placeholder="PIN de 4 números"><select id="ur"><option value="personal">${ROLES.personal}</option><option value="admin">${ROLES.admin}</option></select><button class="btn" data-a="userAdd">Crear usuario</button></div>
  ${D.usuarios.map(u=>`<div class="fila"><div><b>${esc(u.nombre)}${u.id===U.id?' (tú)':''}</b><small>${ROLES[u.rol]}</small></div><div class="acc"><button class="btn sec" data-a="userPin" data-v="${u.id}">Cambiar PIN</button>${u.id===U.id?'':`<button class="btn peligro" data-a="userDel" data-v="${u.id}">Quitar</button>`}</div></div>`).join('')}`;
}
function pendiente(s){return `<h2>${s.n}</h2><p class="sub">Se construye en la parte ${s.p}.</p><div class="pendiente">Aún no está lista.</div>`}
const VISTAS={inicio,mesas,productos,usuarios};

/* ===== Pantalla de ingreso ===== */
function login(){
  const L=$('login');L.classList.add('on');
  const logo='<img src="icon-512.png" alt="SANS">';
  if(!D.usuarios.length){
    L.innerHTML=`${logo}<h2>Crea el administrador</h2><p class="sub">Será el primer usuario, con acceso total.</p><input id="n" placeholder="Nombre" autocomplete="off" data-enter="primerAdmin"><input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="PIN de 4 números" data-enter="primerAdmin"><button class="btn" data-a="primerAdmin">Crear y entrar</button>`;return;
  }
  L.innerHTML=`${logo}<h2>¿Quién eres?</h2><div class="quien">${D.usuarios.map(u=>`<button class="btn sec ${sel===u.id?'sel':''}" data-a="elegir" data-v="${u.id}">${esc(u.nombre)}<small>${ROLES[u.rol]}</small></button>`).join('')}</div>
  ${sel?'<input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="Tu PIN" data-enter="entrar"><button class="btn" data-a="entrar">Entrar</button>':''}`;
  if(sel)$('p').focus();
}

/* ===== Pintar todo ===== */
function render(){
  if(!U){login();return}
  $('login').classList.remove('on');
  $('quien').textContent=U.nombre+' · '+(esAdmin()?'Administrador':'Mozo / cajero');
  const ok=SEC.filter(s=>s.r.includes(U.rol));
  if(!ok.find(s=>s.id===V.id))V={id:'inicio'};
  $('menu').innerHTML=ok.map(s=>`<button data-a="ir" data-v="${s.id}" class="${s.id===V.id?'activo':''}">${s.i}<span>${s.n}</span></button>`).join('');
  const s=SEC.find(x=>x.id===V.id);
  $('vista').innerHTML=VISTAS[V.id]?VISTAS[V.id]():pendiente(s);
}

/* ===== Acciones ===== */
const pinOk=p=>/^\d{4}$/.test(p);
const A={
 primerAdmin(){const n=val('n').trim(),p=val('p');if(!n)return toast('Escribe un nombre');if(!pinOk(p))return toast('El PIN son 4 números');
  const u={id:uid(),nombre:n,pin:p,rol:'admin'};D.usuarios.push(u);guardar();entrarComo(u)},
 elegir(id){sel=id;login()},
 entrar(){const u=D.usuarios.find(x=>x.id===sel);if(u&&u.pin===val('p'))entrarComo(u);else{toast('PIN incorrecto');$('p').value=''}},
 salir(){U=null;sel=null;sessionStorage.removeItem('sans-u');V={id:'inicio'};render()},
 ir(id){V={id};render()},
 volver(){V={id:'mesas'};render()},
 mesa(id){V={id:'mesas',mesa:+id};render()},
 mesaAdd(){if(!esAdmin())return;const n=Math.max(0,...D.mesas.map(m=>m.id))+1;D.mesas.push({id:n,nombre:'Mesa '+n});guardar();render()},
 mesaDel(){if(!esAdmin())return;const m=D.mesas[D.mesas.length-1];if(D.mesas.length<2)return toast('Debe quedar al menos una mesa');if(abierto(m.id))return toast('La última mesa tiene un pedido abierto');D.mesas.pop();guardar();render()},
 add(pid){const x=D.productos.find(p=>p.id===pid);if(!x||x.agotado)return;
  let p=abierto(V.mesa);if(!p){p={id:uid(),mesa:V.mesa,items:[],estado:'abierto',usuario:U.nombre,fecha:new Date().toISOString()};D.pedidos.push(p)}
  const l=p.items.find(i=>i.pid===pid&&!i.enviado);if(l)l.cant++;else p.items.push({pid,nombre:x.nombre,precio:x.precio,cant:1,enviado:false});
  guardar();render()},
 mas(k){const p=abierto(V.mesa);A.add(p.items[+k].pid)},
 menos(k){const p=abierto(V.mesa),i=p.items[+k];
  if(i.enviado&&!esAdmin())return toast('Ya salió a cocina. Solo el administrador puede quitarlo');
  i.cant--;if(i.cant<1)p.items.splice(+k,1);
  if(!p.items.length)D.pedidos.splice(D.pedidos.indexOf(p),1);
  guardar();render()},
 enviar(){const p=abierto(V.mesa);p.items.forEach(i=>i.enviado=true);guardar();toast('Pedido enviado a cocina');render()},
 anular(){const p=abierto(V.mesa);
  if(!esAdmin()&&p.items.some(i=>i.enviado))return toast('Ya salió a cocina. Solo el administrador puede anularlo');
  const mo=prompt('Motivo de la anulación (opcional)');if(mo===null)return;
  Object.assign(p,{estado:'anulado',motivo:mo.trim(),anuladoPor:U.nombre,fechaAnulado:new Date().toISOString()});
  V={id:'mesas'};guardar();toast('Pedido anulado');render()},
 cobrarAbrir(){V.cobro=true;V.metodo='efectivo';render()},
 cobroCerrar(){V.cobro=false;render()},
 metodo(m){V.metodo=m;render()},
 cobrar(){const p=abierto(V.mesa),t=totalP(p),m=V.metodo||'efectivo';let rec=null,vu=0;
  if(m==='efectivo'){rec=parseFloat(val('recibido'));if(!(rec>=t))return toast('El monto recibido no cubre el total');vu=rec-t}
  else if(!val('codigo').trim())return toast(m==='tarjeta'?'Escribe la referencia':'Escribe el código de operación');
  Object.assign(p,{estado:'pagado',total:t,metodo:m,recibido:rec,vuelto:vu,lote:m==='tarjeta'?val('lote').trim():null,codigo:m==='efectivo'?null:val('codigo').trim(),cajero:U.nombre,fechaPago:hoyS(),horaPago:new Date().toISOString()});
  p.items.forEach(i=>i.enviado=true);V={id:'mesas'};guardar();toast(m==='efectivo'?'Cobrado. Vuelto '+soles(vu):'Cobro registrado');render()},
 prodAdd(){if(!esAdmin())return;const n=val('pn').trim(),c=val('pc').trim()||'General',pr=parseFloat(val('pp'));
  if(!n||!(pr>=0))return toast('Escribe nombre y precio');D.productos.push({id:uid(),nombre:n,cat:c,precio:pr,agotado:false});guardar();render()},
 prodPrecio(id){if(!esAdmin())return;const x=D.productos.find(p=>p.id===id),n=parseFloat(prompt('Nuevo precio de '+x.nombre,x.precio));if(n>=0){x.precio=n;guardar();render()}},
 prodAgot(id){if(!esAdmin())return;const x=D.productos.find(p=>p.id===id);x.agotado=!x.agotado;guardar();render()},
 prodDel(id){if(!esAdmin()||!confirm('¿Quitar este producto?'))return;D.productos=D.productos.filter(p=>p.id!==id);guardar();render()},
 userAdd(){if(!esAdmin())return;const n=val('un').trim(),p=val('up');if(!n)return toast('Escribe un nombre');if(!pinOk(p))return toast('El PIN son 4 números');
  if(D.usuarios.some(u=>u.nombre.toLowerCase()===n.toLowerCase()))return toast('Ya existe un usuario con ese nombre');
  D.usuarios.push({id:uid(),nombre:n,pin:p,rol:val('ur')});guardar();toast('Usuario creado');render()},
 userPin(id){if(!esAdmin())return;const p=prompt('Nuevo PIN de 4 números');if(p===null)return;if(!pinOk(p))return toast('El PIN son 4 números');D.usuarios.find(u=>u.id===id).pin=p;guardar();toast('PIN cambiado')},
 userDel(id){if(!esAdmin()||!confirm('¿Quitar este usuario?'))return;D.usuarios=D.usuarios.filter(u=>u.id!==id);guardar();render()}
};
function entrarComo(u){U=u;sessionStorage.setItem('sans-u',u.id);V={id:'inicio'};render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter)A[e.target.dataset.enter]()});

/* ===== Arranque ===== */
(function(){const id=sessionStorage.getItem('sans-u');U=D.usuarios.find(u=>u.id===id)||null;render()})();
window.addEventListener('load',()=>setTimeout(()=>document.body.classList.add('listo'),900));
let ev;const bi=$('instalar');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;bi.style.display='block'});
bi.addEventListener('click',async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ev=null;bi.style.display='none'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script>
