<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SANS Burgers · POS</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--negro:#000;--carbon:#141414;--panel:#1d1d1d;--linea:#2e2e2e;--am:#FFC81E;--gris:#9a9a9a;--blanco:#f5f5f0;--ok:#5fd38a;--mal:#ff6b5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--negro);color:var(--blanco);padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
small{display:block;color:var(--gris);font-size:.78rem;font-weight:400;margin-top:2px}
h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
h3{font-size:1rem;margin:18px 0 8px;color:var(--am)}
.sub{color:var(--gris);margin-bottom:16px}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:90;transition:opacity .5s .6s,visibility 0s 1.1s}
#splash img{width:180px;height:180px;border-radius:50%}
#splash p{color:var(--am);font-weight:700}
body.listo #splash{opacity:0;visibility:hidden}
/* Ingreso */
#login{position:fixed;inset:0;background:#000;z-index:60;display:none;overflow:hidden}
#login.on{display:block}
.glow{position:absolute;inset:0;background:radial-gradient(60% 45% at 70% 0%,rgba(255,200,30,.26),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(255,200,30,.12),transparent 70%)}
.lg2{position:relative;height:100%;overflow-y:auto;display:grid;grid-template-columns:1fr}
.lg-izq{display:none}
.lg-der{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 20px;min-height:100%}
.lg-mov{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.lg-logo{width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 3px var(--am),0 0 40px rgba(255,200,30,.35)}
.lg-mov h1{font-size:2.4rem;font-weight:800;color:var(--am);line-height:1;margin-top:12px;letter-spacing:.02em}
.lema{color:var(--gris)}
.pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--linea);border-radius:999px;padding:6px 12px;font-size:.8rem}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.card{width:100%;max-width:380px;background:rgba(29,29,29,.92);border:1px solid var(--linea);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:1.7rem;margin:0}
.card label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--blanco);font-weight:500}
.card input{width:100%;font-size:1rem;color:var(--blanco)}
.pw{position:relative}.pw input{padding-right:48px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--gris);padding:10px}
.pw button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card .btn{width:100%;padding:14px;font-size:1.05rem;box-shadow:0 8px 24px rgba(255,200,30,.25)}
.enlace{color:var(--am);font-weight:500;text-align:center;font-size:.9rem;padding:4px}
.lg-der>small{text-align:center}
@media(min-width:900px){
 .lg2{grid-template-columns:1.1fr 1fr}
 .lg-mov{display:none}
 .lg-izq{display:flex;flex-direction:column;justify-content:space-between;padding:40px 56px;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px}
 .marca{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.3rem;color:var(--am)}
 .marca img{width:48px;height:48px;border-radius:50%}
 .lg-izq h2{font-size:2.5rem;font-weight:800;line-height:1.15;margin-bottom:24px}
 .checks{list-style:none;display:flex;flex-direction:column;gap:12px;max-width:460px}
 .checks li{background:rgba(255,255,255,.07);border:1px solid var(--linea);border-radius:12px;padding:13px 16px;display:flex;gap:10px;align-items:center}
 .checks li::before{content:'\2713';color:var(--am);font-weight:800}
 .pie{color:var(--gris);font-size:.9rem}
}
/* App */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--carbon);border-bottom:3px solid var(--am)}
header img{width:44px;height:44px;border-radius:50%}
header h1{font-size:1.25rem;font-weight:800;color:var(--am);line-height:1}
header .der{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--linea);padding:7px 12px;border-radius:999px;font-size:.82rem}
#instalar{display:none;background:var(--am);color:#000;font-weight:700;border:0}
main{overflow-y:auto;padding:18px 16px 28px}
.vista{max-width:980px;margin:0 auto}
nav{display:flex;overflow-x:auto;background:var(--carbon);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;font-size:.72rem;color:var(--gris);border-top:3px solid transparent}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.activo{color:var(--am);border-top-color:var(--am)}
.btn{background:var(--am);color:#000;font-weight:700;padding:12px 16px;border-radius:10px;border:1px solid var(--am)}
.btn.sec{background:var(--panel);color:var(--blanco);border-color:var(--linea)}
.btn.peligro{background:transparent;color:var(--mal);border-color:var(--mal)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:12px;min-width:0}
.fila-b{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.acc .btn{padding:8px 12px;font-size:.85rem}.acc select{padding:8px}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.cifra{background:var(--panel);border-left:4px solid var(--am);border-radius:8px;padding:14px}
.cifra b{display:block;font-size:1.5rem;font-weight:800}.cifra span{color:var(--gris);font-size:.82rem}
.metodos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.mesas,.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mesa,.prod{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.mesa b{font-size:1.1rem}.mesa span,.prod span{color:var(--gris);font-size:.85rem}
.mesa.ocupada{background:var(--am);color:#000;border-color:var(--am)}.mesa.ocupada span{color:#000;font-weight:700}
.mesa.nueva{background:transparent;border-style:dashed;color:var(--am)}.mesa.nueva b{font-size:1.5rem}
.prod{text-align:left;padding:12px}.prod:disabled{opacity:.4}
.ped{display:grid;gap:16px;margin-top:8px}
.orden{background:var(--panel);border-radius:12px;padding:14px;align-self:start}
.orden input{width:100%;margin-bottom:8px}
.linea{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
.cant{display:flex;align-items:center;gap:10px}
.cant button{width:34px;height:34px;border-radius:8px;background:var(--carbon);border:1px solid var(--linea);font-size:1.2rem}
.tot{display:flex;justify-content:space-between;font-size:1.2rem;padding-top:12px}
.cobro input{width:100%;margin-bottom:8px}
.pendiente{background:var(--panel);border:1px dashed var(--linea);border-radius:10px;padding:24px;color:var(--gris)}
.estado{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);margin-bottom:16px}
.estado i{width:10px;height:10px;border-radius:50%;background:var(--mal)}.estado.abierta i{background:var(--ok)}
.panel{background:var(--panel);border-radius:12px;padding:16px;margin:12px 0}
.panel input{width:100%;margin-bottom:8px}
.dens{margin-bottom:4px}
.den{display:grid;grid-template-columns:1fr 84px 92px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea);font-size:.92rem}
.den input{margin:0;padding:9px;text-align:center}.den b{text-align:right}
.dif{font-weight:700}.dif.ok{color:var(--ok)}.dif.sob{color:var(--am)}.dif.fal{color:var(--mal)}
button.fila{width:100%;text-align:left;border:0;color:inherit}
.cifra.grande{border-left-color:var(--ok)}.cifra.grande b{font-size:1.9rem}
.mv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea);font-size:.9rem}
.mv .neg{color:var(--mal)}.mv .pos{color:var(--ok)}.mv .tenue{color:var(--gris)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--am);color:#000;font-weight:700;padding:12px 18px;border-radius:14px;z-index:95;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:900px){
 #app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
 header{grid-column:1/3}
 nav{grid-row:2;grid-column:1;flex-direction:column;overflow-y:auto;border-top:0;border-right:1px solid var(--linea)}
 nav button{flex:0 0 auto;flex-direction:row;gap:12px;padding:14px 18px;font-size:.95rem;border-top:0;border-left:4px solid transparent}
 nav button.activo{border-left-color:var(--am)}
 main{grid-row:2;grid-column:2;padding:28px}
 .ped{grid-template-columns:1.5fr 1fr}.ped .orden{grid-column:2;grid-row:1}.ped .cat{grid-column:1;grid-row:1}
}
@media(prefers-reduced-motion:reduce){#splash,#toast{transition:none}}
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="SANS"><p>Burgers hechas para ti</p></div>
<div id="login"></div>
<div id="toast" role="status"></div>
<div id="app">
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>SANS</h1><small id="quien"></small></div>
    <div class="der"><button id="instalar" class="chip">Instalar app</button><button class="chip" data-a="salir">Cambiar usuario</button></div>
  </header>
  <main><div class="vista" id="vista"></div></main>
  <nav id="menu" aria-label="Menú principal"></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== Nube (Supabase) ===== */
const SB_URL='https://ejwkzzxpdmbqpshqrlbl.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqd2t6enhwZG1icXBzaHFybGJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MzIyMzksImV4cCI6MjEwNzAwODIzOX0.znNAtS8Ruo0ailfiSbXZuH11LM3i0BEs1MHVEUuRXYY';
const DOMINIO='sans-pos.app',VERSION='v5';
let sb=null;
const D={productos:[],mesas:[],pedidos:[],perfiles:[],caja:null,cajas:[],movs:[],detMovs:[]};
let P=null,V={id:'inicio'},busy=false,rt=null;
const ROL={mozo:'Mozo',caja:'Caja',admin:'Administrador'};
const TIPO={salon:'Salón',llevar:'Para llevar',delivery:'Delivery'};
const esAdmin=()=>P.rol==='admin',esCaja=()=>P.rol!=='mozo';
const $=id=>document.getElementById(id);
const val=id=>($(id)||{value:''}).value;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soles=n=>'S/ '+Number(n||0).toFixed(2);
const msg=e=>/row-level security|permission/i.test((e&&e.message)||'')?'No tienes permiso para hacer esto':((e&&e.message)||'Algo salió mal');
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}
const pedidoMesa=id=>D.pedidos.find(p=>p.estado==='abierto'&&p.mesa_id===id);
const conItems=p=>p&&p.items.length>0;
const totalP=p=>p.items.reduce((a,i)=>a+i.precio*i.cant,0);
const inicioDia=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

async function cargarTodo(){
  const cj=await sb.from('cajas').select('*').order('abierta_en',{ascending:false}).limit(15);
  if(cj.error)throw cj.error;
  D.caja=cj.data.find(c=>c.estado==='abierta')||null;
  D.cajas=cj.data.filter(c=>c.estado==='cerrada');
  const cid=D.caja&&D.caja.id;
  const orf=`estado.eq.abierto,and(estado.eq.pagado,pagado_en.gte.${inicioDia().toISOString()})`+(cid?`,caja_id.eq.${cid}`:'');
  const [pr,me,pe,mv]=await Promise.all([
    sb.from('productos').select('*').order('categoria').order('nombre'),
    sb.from('mesas').select('*').order('orden'),
    sb.from('pedidos').select('*, pedido_items(*)').or(orf),
    cid?sb.from('caja_movimientos').select('*').eq('caja_id',cid).order('creado'):Promise.resolve({data:[],error:null})
  ]);
  const er=pr.error||me.error||pe.error||mv.error;if(er)throw er;
  D.productos=pr.data;D.mesas=me.data;D.movs=mv.data;
  D.pedidos=pe.data.map(p=>({...p,items:(p.pedido_items||[]).sort((a,b)=>a.creado.localeCompare(b.creado))}));
}
async function op(fn,ok){
  if(busy)return;busy=true;
  try{const r=await fn();if(r&&r.error)throw r.error;await cargarTodo();if(ok)toast(ok)}
  catch(e){toast(msg(e))}
  finally{busy=false;render()}
}
const escribiendo=()=>{const a=document.activeElement;return a&&/INPUT|SELECT/.test(a.tagName)&&$('vista').contains(a)};
function suscribir(){
  if(rt)return;let t;
  const f=()=>{clearTimeout(t);t=setTimeout(async()=>{try{await cargarTodo();if(!escribiendo())render()}catch(e){}},350)};
  rt=sb.channel('sans');
  ['pedidos','pedido_items','productos','mesas','cajas','caja_movimientos'].forEach(tb=>rt.on('postgres_changes',{event:'*',schema:'public',table:tb},f));
  rt.subscribe();
}
async function fn(body){
  const {data,error}=await sb.functions.invoke('usuarios',{body});
  if(error){let m=error.message;try{const j=await error.context.json();if(j.error)m=j.error}catch(_){}throw new Error(m)}
  if(data&&data.error)throw new Error(data.error);return data;
}

/* ===== Menú y permisos ===== */
const ico=d=>`<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const SEC=[
 {id:'inicio',n:'Inicio',r:['caja','admin'],i:ico('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>')},
 {id:'mesas',n:'Mesas',r:['mozo','caja','admin'],i:ico('<rect x="3" y="8" width="18" height="3" rx="1"/><path d="M6 11v9M18 11v9"/>')},
 {id:'productos',n:'Productos',r:['admin'],i:ico('<path d="M4 11h16a8 8 0 0 0-16 0z"/><path d="M4 15h16M5 19h14"/>')},
 {id:'usuarios',n:'Usuarios',r:['admin'],i:ico('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/>')},
 {id:'caja',n:'Caja',r:['caja','admin'],i:ico('<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>')},
 {id:'reportes',n:'Reportes',r:['admin'],p:4,i:ico('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>')},
 {id:'historial',n:'Historial',r:['admin'],p:4,i:ico('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')}
];

/* ===== Vistas ===== */
const hora=t=>new Date(t).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
const fecha=t=>new Date(t).toLocaleDateString('es-PE',{day:'2-digit',month:'short'});
function inicio(){
  const c=D.caja;
  const pag=D.pedidos.filter(p=>p.estado==='pagado'&&(c?p.caja_id===c.id:true));
  const tot=pag.reduce((a,p)=>a+p.total,0);
  const it=pag.reduce((a,p)=>a+p.items.reduce((x,i)=>x+i.cant,0),0);
  const ocup=D.pedidos.filter(p=>p.estado==='abierto'&&conItems(p)).length;
  const met=['efectivo','yape','plin','tarjeta'].map(m=>`<span class="chip">${m[0].toUpperCase()+m.slice(1)} ${soles(pag.filter(p=>p.metodo===m).reduce((a,p)=>a+p.total,0))}</span>`).join(' ');
  const est=c?`<div class="estado abierta"><i></i>Caja abierta desde las ${hora(c.abierta_en)} · fondo ${soles(c.fondo_inicial)}</div>`:'<div class="estado"><i></i>Caja cerrada</div>';
  return `<h2>Hola, ${esc(P.nombre)}</h2><p class="sub">Resumen ${c?'del turno':'de hoy'}</p>${est}
  <div class="cifras"><div class="cifra"><b>${soles(tot)}</b><span>Ventas ${c?'del turno':'de hoy'}</span></div><div class="cifra"><b>${pag.length}</b><span>Pedidos cobrados</span></div><div class="cifra"><b>${it}</b><span>Productos vendidos</span></div><div class="cifra"><b>${ocup}</b><span>Pedidos abiertos</span></div></div>
  <div class="fila-b" style="margin:0 0 18px">${met}</div>
  <div class="fila-b"><button class="btn" data-a="ir" data-v="mesas">Ver mesas</button><button class="btn ${c?'sec':''}" data-a="ir" data-v="caja">${c?'Ir a caja':'Abrir caja'}</button>${esAdmin()?'<button class="btn sec" data-a="ir" data-v="productos">Productos</button><button class="btn sec" data-a="ir" data-v="usuarios">Usuarios</button>':''}</div>`;
}
function cardMesa(m){
  const p=pedidoMesa(m.id),oc=conItems(p);
  return `<button class="mesa ${oc?'ocupada':''}" data-a="mesa" data-v="${m.id}"><b>${esc(m.nombre)}</b><span>${oc?soles(totalP(p)):'Libre'}</span>${oc&&p.cliente?`<span>${esc(p.cliente)}</span>`:''}</button>`;
}
function mesasView(){
  if(V.mesa)return pedidoView();
  const lbl={salon:'Agregar mesa',llevar:'Agregar recojo',delivery:'Agregar delivery'};
  const sec=Object.keys(TIPO).map(t=>{
    const ms=D.mesas.filter(m=>m.tipo===t);if(!ms.length&&!esAdmin())return '';
    return `<h3>${TIPO[t]}</h3><div class="mesas">${ms.map(cardMesa).join('')}${esAdmin()?`<button class="mesa nueva" data-a="mesaAdd" data-v="${t}"><b>+</b><span>${lbl[t]}</span></button>`:''}</div>`;
  }).join('');
  return `<h2>Mesas</h2><p class="sub">Toca una para tomar o ver su pedido</p>${sec}`;
}
const linea=i=>`<div class="linea"><div><b>${esc(i.nombre)}</b><small>${i.producto_id?(i.enviado?'Enviado a cocina':'Por enviar')+' · ':''}${soles(i.precio)}</small></div>${i.producto_id?`<div class="cant"><button data-a="menos" data-v="${i.id}" aria-label="Quitar uno">−</button><b>${i.cant}</b><button data-a="mas" data-v="${i.id}" aria-label="Agregar uno">+</button></div>`:`<button class="btn peligro" style="padding:8px 12px" data-a="quitar" data-v="${i.id}">Quitar</button>`}</div>`;
function pedidoView(){
  const m=D.mesas.find(x=>x.id===V.mesa);if(!m){V={id:'mesas'};return mesasView()}
  const p=pedidoMesa(V.mesa)||{items:[]},tot=totalP(p),hay=p.items.length>0;
  const cats=[...new Set(D.productos.map(x=>x.categoria))];

const MOV={ingreso:'Ingreso',retiro:'Retiro',gasto:'Gasto',devolucion:'Devolución'};
const DEN=[200,100,50,20,10,5,2,1,0.5,0.2,0.1];
const kv=n=>esc((V.k&&V.k[n])||'');
const centsDen=pre=>DEN.reduce((a,d)=>a+Math.round(d*100)*Math.max(0,parseInt(V.k&&V.k[pre+'_'+d])||0),0);
const difTxt=d=>d===0?'Cuadra exacto':d>0?`Sobrante ${soles(d)}`:`Faltante ${soles(-d)}`;
const difCls=d=>d===0?'ok':d>0?'sob':'fal';
function contador(pre){
  const filas=DEN.map(d=>{const q=Math.max(0,parseInt(V.k&&V.k[pre+'_'+d])||0);
   return `<label class="den"><span>${d>=10?'Billete':'Moneda'} S/ ${d}</span><input type="number" min="0" inputmode="numeric" placeholder="0" data-pre="${pre}" data-den="${d}" data-k="${pre}_${d}" value="${q||''}" oninput="recalcDen('${pre}')"><b id="${pre}-${String(d).replace('.','_')}">${soles(Math.round(d*100)*q/100)}</b></label>`}).join('');
  return `<div class="dens">${filas}</div><div class="tot"><span>Total contado</span><b id="${pre}-total">${soles(centsDen(pre)/100)}</b></div>`;
}
function leerDen(pre){let t=0;const d={};document.querySelectorAll(`[data-pre="${pre}"]`).forEach(i=>{const q=Math.max(0,parseInt(i.value)||0);if(q){d[i.dataset.den]=q;t+=Math.round(+i.dataset.den*100)*q}});return {desglose:d,total:t/100}}
function recalcDen(pre){
  let t=0;
  document.querySelectorAll(`[data-pre="${pre}"]`).forEach(i=>{const q=Math.max(0,parseInt(i.value)||0),c=Math.round(+i.dataset.den*100)*q;t+=c;$(pre+'-'+i.dataset.den.replace('.','_')).textContent=soles(c/100)});
  $(pre+'-total').textContent=soles(t/100);
  if(pre==='cie'&&D.caja){const d=Math.round(t-resumenCaja(D.caja).esperado*100)/100/1;const e=$('cie-dif');if(e){const x=Math.round(t-Math.round(resumenCaja(D.caja).esperado*100))/100;e.textContent=difTxt(x);e.className='dif '+difCls(x)}}
}
function resumenCaja(c){
  const pag=D.pedidos.filter(p=>p.estado==='pagado'&&p.caja_id===c.id);
  const por=m=>pag.filter(p=>p.metodo===m).reduce((a,p)=>a+p.total,0);
  const mv=t=>D.movs.filter(x=>x.tipo===t).reduce((a,x)=>a+x.monto,0);
  const r={efectivo:por('efectivo'),yape:por('yape'),plin:por('plin'),tarjeta:por('tarjeta'),ingreso:mv('ingreso'),retiro:mv('retiro'),gasto:mv('gasto'),devolucion:mv('devolucion'),n:pag.length};
  r.esperado=Math.round((c.fondo_inicial+r.efectivo+r.ingreso-r.retiro-r.gasto-r.devolucion)*100)/100;return r;
}

 delivery(){const v=parseFloat(prompt('Costo de delivery (S/)'));if(!(v>=0))return;
  op(async()=>{const a=await asegurar();if(a.error)return a;const l=a.p.items.find(i=>!i.producto_id&&i.nombre==='Delivery');
   return l?sb.from('pedido_items').update({precio:v}).eq('id',l.id):sb.from('pedido_items').insert({pedido_id:a.p.id,nombre:'Delivery',precio:v,cant:1})})},
 enviar(){const p=pedidoMesa(V.mesa);op(()=>sb.from('pedido_items').update({enviado:true}).eq('pedido_id',p.id).eq('enviado',false).not('producto_id','is',null),'Pedido enviado a cocina')},
 anular(){if(!esCaja())return;const p=pedidoMesa(V.mesa);
  if(!esAdmin()&&p.items.some(i=>i.enviado))return toast('Ya salió a cocina. Solo el administrador puede anularlo');
  const mo=prompt('Motivo de la anulación (opcional)');if(mo===null)return;V={id:'mesas'};
  op(()=>sb.from('pedidos').update({estado:'anulado',motivo_anulacion:mo.trim(),anulado_por:P.nombre,anulado_en:new Date().toISOString()}).eq('id',p.id),'Pedido anulado')},
 cobrarAbrir(){if(!D.caja){toast('Primero abre la caja para poder cobrar');V={id:'caja'};render();return}V.cobro=true;V.metodo='efectivo';V.k={};render()},
 cobroCerrar(){V.cobro=false;render()},
 metodo(m){V.metodo=m;render()},
 cobrar(){if(!esCaja())return;if(!D.caja)return toast('Abre la caja para poder cobrar');const p=pedidoMesa(V.mesa),t=totalP(p),m=V.metodo||'efectivo';let rec=null,vu=0;
  if(m==='efectivo'){rec=parseFloat(val('recibido'));if(!(rec>=t))return toast('El monto recibido no cubre el total');vu=rec-t}
  else if(!val('codigo').trim())return toast(m==='tarjeta'?'Escribe la referencia':'Escribe el código de operación');
  const cambio=vu,cid=D.caja.id;V={id:'mesas'};
  op(()=>sb.from('pedidos').update({estado:'pagado',total:t,metodo:m,recibido:rec,vuelto:vu,lote:m==='tarjeta'?val('lote').trim():null,codigo:m==='efectivo'?null:val('codigo').trim(),cajero:P.nombre,pagado_en:new Date().toISOString(),caja_id:cid}).eq('id',p.id),m==='efectivo'?'Cobrado. Vuelto '+soles(cambio):'Cobro registrado')},
 cajaAbrir(){if(!esCaja())return;const {total,desglose}=leerDen('ape');if(!confirm('¿Abrir la caja con un fondo de '+soles(total)+'?'))return;
  V={id:'caja'};op(()=>sb.rpc('abrir_caja',{p_fondo:total,p_desglose:desglose}),'Caja abierta')},
 movAbrir(t){V.mov=t;V.cierre=false;V.k={};render()},
 movCancelar(){V.mov=null;render()},
 movGuardar(){const m=parseFloat(val('mmonto')),mo=val('mmotivo').trim();if(!(m>0))return toast('Escribe el monto');if(!mo)return toast('Escribe el motivo');
  const t=V.mov;V={id:'caja'};op(()=>sb.from('caja_movimientos').insert({caja_id:D.caja.id,tipo:t,monto:m,motivo:mo,usuario_id:P.id,usuario_nombre:P.nombre}),MOV[t]+' registrado')},
 cierreAbrir(){V.cierre=true;V.mov=null;V.k={};render()},
 cierreCancelar(){V.cierre=false;render()},
 cajaCerrar(){const {total,desglose}=leerDen('cie'),esp=resumenCaja(D.caja).esperado,dif=Math.round((total-esp)*100)/100;
  const ab=D.pedidos.filter(p=>p.estado==='abierto'&&conItems(p)).length;
  if(ab&&!confirm(`Hay ${ab} pedido(s) abierto(s) sin cobrar. ¿Cerrar la caja igual?`))return;
  if(!confirm(`Esperado ${soles(esp)} · Contado ${soles(total)}\n${difTxt(dif)}\n¿Cerrar la caja?`))return;
  const nota=val('cnota').trim();V={id:'caja'};op(()=>sb.rpc('cerrar_caja',{p_contado:total,p_desglose:desglose,p_nota:nota}),'Caja cerrada. '+difTxt(dif))},
 cajaReabrir(){if(!esAdmin()||!confirm('¿Reabrir el último cierre? Se descartará su conteo.'))return;op(()=>sb.rpc('reabrir_caja'),'Caja reabierta')},
 async verCaja(id){if(V.ver===id){V.ver=null;return render()}
  const r=await sb.from('caja_movimientos').select('*').eq('caja_id',id).order('creado');D.detMovs=r.data||[];V.ver=id;render()},
 prodAdd(){if(!esAdmin())return;const n=val('pn').trim(),c=val('pc').trim()||'General',pr=parseFloat(val('pp'));
  if(!n||!(pr>=0))return toast('Escribe nombre y precio');op(()=>sb.from('productos').insert({nombre:n,categoria:c,precio:pr}))},
 prodPrecio(id){const x=D.productos.find(p=>p.id===id),n=parseFloat(prompt('Nuevo precio de '+x.nombre,x.precio));if(n>=0)op(()=>sb.from('productos').update({precio:n}).eq('id',id))},
 prodAgot(id){const x=D.productos.find(p=>p.id===id);op(()=>sb.from('productos').update({agotado:!x.agotado}).eq('id',id))},
 prodDel(id){if(confirm('¿Quitar este producto?'))op(()=>sb.from('productos').delete().eq('id',id))},
 async userAdd(){try{await fn({accion:'crear',nombre:val('un'),usuario:val('uu'),password:val('up'),rol:val('ur')});toast('Usuario creado');A.ir('usuarios')}catch(e){toast(e.message)}},
 async userPass(id){const p=prompt('Nueva contraseña (mínimo 6 caracteres)');if(p===null)return;try{await fn({accion:'password',id,password:p});toast('Contraseña cambiada')}catch(e){toast(e.message)}},
 async userDel(id){if(!confirm('¿Quitar este usuario?'))return;try{await fn({accion:'eliminar',id});toast('Usuario quitado');A.ir('usuarios')}catch(e){toast(e.message)}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){V.k=V.k||{};V.k[k]=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter)A[e.target.dataset.enter]()});
document.addEventListener('change',async e=>{
  const t=e.target,c=t.dataset&&t.dataset.campo;
  if(c){V.datos=V.datos||{};V.datos[c]=t.value;const p=pedidoMesa(V.mesa);if(p){const r=await sb.from('pedidos').update({[c]:t.value}).eq('id',p.id);if(r.error)toast(msg(r.error))}}
  if(t.dataset&&t.dataset.rolu){try{await fn({accion:'rol',id:t.dataset.rolu,rol:t.value});toast('Rol cambiado')}catch(er){toast(er.message)}A.ir('usuarios')}
});

/* ===== Arranque ===== */
(async function(){
  if(!window.supabase){toast('No se pudo cargar. Revisa tu conexión a internet');$('login').classList.add('on');$('login').innerHTML=envolver('<p class="sub">Sin conexión.</p>');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(session)iniciar();else pantallaLogin();
})();
window.addEventListener('load',()=>setTimeout(()=>document.body.classList.add('listo'),900));
let ev;const bi=$('instalar');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;bi.style.display='block'});
bi.addEventListener('click',async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ev=null;bi.style.display='none'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script>
